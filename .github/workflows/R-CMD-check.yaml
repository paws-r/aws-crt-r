# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }}${{ matrix.config.cc && format(', {0}', matrix.config.cc) || '' }})

    strategy:
      fail-fast: false
      matrix:
        config:
          # Check Dev R versions
          - { os: "ubuntu-latest", r: "devel" }
          - { os: "macOS-latest", r: "devel" }
          - { os: "windows-latest", r: "devel" }

          # x86_64 clang, as used by CRAN's pretest
          - { os: "ubuntu-latest", r: "latest", cc: "clang" }

          # Check latest R versions
          - { os: "ubuntu-latest", r: "latest" }
          - { os: "macOS-latest", r: "latest" }
          - { os: "windows-latest", r: "latest" }

          # Check oldrel-1 versions of R
          - { os: "ubuntu-latest", r: "oldrel-1" }
          - { os: "macOS-latest", r: "oldrel-1" }
          - { os: "windows-latest", r: "oldrel-1" }

          # Check oldrel-2 versions of R
          - { os: "ubuntu-latest", r: "oldrel-2" }
          - { os: "macOS-latest", r: "oldrel-2" }
          - { os: "windows-latest", r: "oldrel-2" }

          # Check oldrel-3 versions of R
          - { os: "ubuntu-latest", r: "oldrel-3" }
          - { os: "macOS-latest", r: "oldrel-3" }
          - { os: "windows-latest", r: "oldrel-3" }
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - name: Use alternative C compiler
        if: matrix.config.cc != ''
        shell: bash
        run: |
          mkdir -p ~/.R
          printf 'CC = ${{ matrix.config.cc }}\n' >> ~/.R/Makevars

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          error-on: '"note"'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
